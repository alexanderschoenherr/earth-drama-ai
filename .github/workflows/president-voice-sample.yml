name: President voice sample check
on:
  push:
    paths:
      - '.github/workflows/president-voice-sample.yml'
  workflow_dispatch:
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Test directness, follow-up and initiative
        shell: bash
        run: |
          node <<'NODE'
          const endpoint = "https://earth-drama-president.alex-schoenherr.workers.dev/chat";
          const origin = "https://alexanderschoenherr.github.io";
          const intro = [{role:"user",content:"i need money"}];
          async function reply(label,messages){
            const response=await fetch(endpoint,{
              method:"POST",
              headers:{"Origin":origin,"Content-Type":"application/json"},
              body:JSON.stringify({messages}),
              signal:AbortSignal.timeout(75000)
            });
            const data=await response.json();
            console.log(label+"_HTTP",response.status);
            console.log(label+"_REPLY",JSON.stringify(data.reply ?? data.message ?? null));
            if(!response.ok || !data.reply)throw Error(label+" failed: "+(data.error||response.status));
            return data.reply;
          }
          (async()=>{
            const one=await reply("MONEY",intro);
            await reply("RENT",[
              ...intro,{role:"assistant",content:one},{role:"user",content:"rent"}
            ]);
            await reply("INITIATIVE",[{role:"user",content:"u pick"}]);
            console.log("PRESIDENT_CONVERSATION_TEST_PASSED");
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          NODE
